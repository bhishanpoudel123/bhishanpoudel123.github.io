  <!-- highlight.js v9 (matches your existing highlight.pack.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/9.18.5/highlight.min.js"></script>

  <script>
    function includeHTML(filePath, elementId) {
      fetch(filePath)
        .then(function(response) {
          if (!response.ok) throw new Error('Failed to load ' + filePath + ' (HTTP ' + response.status + ')');
          return response.text();
        })
        .then(function(html) {
          var target = document.getElementById(elementId);
          if (!target) return;

          target.innerHTML = html;
          target.style.textAlign = 'left';

          // highlight.js v9 API: use highlightBlock, not highlightElement
          target.querySelectorAll('pre code').forEach(function(block) {
            if (window.hljs && typeof hljs.highlightBlock === 'function') {
              hljs.highlightBlock(block);
            }
          });
        })
        .catch(function(err) { console.error('[includeHTML]', err); });
    }

    document.addEventListener('DOMContentLoaded', function () {
      includeHTML('topics/databricks-snippets/databricks-snippets.html', 'databricks-snippets');
      includeHTML('topics/python-snippets/python-snippets.html',         'python-snippets');
      includeHTML('topics/notes-caveats/notes-caveats.html',             'notes-caveats');
      includeHTML('topics/troubleshoots/troubleshoots.html',             'troubleshoots');
      includeHTML('topics/dec-2021/dec-2021.html',                       'dec-2021');
      includeHTML('topics/jan-2022/jan-2022.html',                       'jan-2022');
    });
  </script>
